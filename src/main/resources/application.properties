spring.application.name=buspass-tracker
server.port=8080

# ---- MySQL (override with environment variables if needed) ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:buspass_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=Naveen1234

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- JWT (change the secret for any real deployment; must be 32+ characters) ----
app.jwt.secret=${JWT_SECRET:BusPassTrackerSecretKeyForJwtSigning-ChangeMe-2026}
app.jwt.expiration-ms=86400000

# ---- Default admin account created on first start ----
app.admin.name=System Admin
app.admin.email=admin@buspass.com
app.admin.password=Admin@123

# ---- Swagger UI ----
springdoc.swagger-ui.path=/swagger-ui.html
