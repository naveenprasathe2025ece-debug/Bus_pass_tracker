<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BusPass - Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="top">
  <h1>BusPass - Admin Console</h1>
  <div class="who"><span id="who"></span><button class="secondary small" onclick="Auth.logout()">Logout</button></div>
</header>
<main>
  <div id="msg" class="msg hidden"></div>
  <div class="stats" id="stats"></div>

  <div class="tabs">
    <button class="active" data-tab="applications">Applications</button>
    <button data-tab="expiring">Expiring Passes</button>
    <button data-tab="routes">Routes</button>
    <button data-tab="students">Students</button>
  </div>

  <!-- Applications -->
  <section id="tab-applications" class="card">
    <h2>Applications</h2>
    <div class="grid">
      <div><label for="fStatus">Status</label>
        <select id="fStatus"><option value="">All</option><option>PENDING</option><option>APPROVED</option><option>REJECTED</option></select></div>
      <div><label for="fRoute">Route</label><select id="fRoute"><option value="">All</option></select></div>
      <div><label for="fFrom">Applied from</label><input id="fFrom" type="date"></div>
      <div><label for="fTo">Applied to</label><input id="fTo" type="date"></div>
    </div>
    <button id="filterBtn" type="button">Apply filter</button>
    <div class="table-wrap" style="margin-top:14px">
      <table>
        <thead><tr><th>#</th><th>Student</th><th>Route</th><th>Boarding</th><th>Photo ref</th><th>Status</th><th>Remark / Reason</th><th>Pass</th><th>Validity</th><th>Applied</th><th></th></tr></thead>
        <tbody id="appRows"></tbody>
      </table>
    </div>
  </section>

  <!-- Expiring -->
  <section id="tab-expiring" class="card hidden">
    <h2>Passes expiring soon</h2>
    <div class="grid"><div><label for="days">Within next (days)</label><input id="days" type="number" min="1" max="365" value="30"></div></div>
    <button id="expBtn" type="button">Show</button>
    <div class="table-wrap" style="margin-top:14px">
      <table>
        <thead><tr><th>Pass no.</th><th>Student</th><th>Register no.</th><th>Route</th><th>Valid to</th><th>Days left</th></tr></thead>
        <tbody id="expRows"></tbody>
      </table>
    </div>
  </section>

  <!-- Routes -->
  <section id="tab-routes" class="card hidden">
    <h2>Bus Routes</h2>
    <form id="routeForm">
      <div class="grid">
        <div><label for="rNo">Route number</label><input id="rNo" required maxlength="20"></div>
        <div><label for="rName">Route name</label><input id="rName" required maxlength="150"></div>
        <div><label for="rStart">Start point</label><input id="rStart" required maxlength="100"></div>
        <div><label for="rEnd">End point</label><input id="rEnd" required maxlength="100"></div>
        <div><label for="rFare">Fare (Rs.)</label><input id="rFare" type="number" min="1" step="0.01" required></div>
      </div>
      <button type="submit">Add route</button>
    </form>
    <div class="table-wrap" style="margin-top:14px">
      <table>
        <thead><tr><th>No.</th><th>Name</th><th>Start</th><th>End</th><th>Fare</th><th>Active</th><th></th></tr></thead>
        <tbody id="routeRows"></tbody>
      </table>
    </div>
  </section>

  <!-- Students -->
  <section id="tab-students" class="card hidden">
    <h2>Registered Students</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>Name</th><th>Register no.</th><th>Department</th><th>Email</th><th>Phone</th></tr></thead>
        <tbody id="studentRows"></tbody>
      </table>
    </div>
  </section>
</main>

<dialog id="reviewDialog">
  <h2 id="dlgTitle"></h2>
  <form id="reviewForm">
    <label for="dRemark">Remark (required)</label>
    <textarea id="dRemark" rows="2" required maxlength="500"></textarea>
    <div id="approveFields">
      <label for="dFrom">Valid from</label><input id="dFrom" type="date">
      <label for="dTo">Valid to</label><input id="dTo" type="date">
    </div>
    <div id="rejectFields" class="hidden">
      <label for="dReason">Rejection reason (required)</label>
      <textarea id="dReason" rows="2" maxlength="500"></textarea>
    </div>
    <div id="dlgError" class="msg error hidden" style="margin-top:12px"></div>
    <button type="submit" id="dlgSubmit">Confirm</button>
    <button type="button" class="secondary" id="dlgCancel">Close</button>
  </form>
</dialog>

<script src="/js/app.js"></script>
<script>
  const msg = document.getElementById('msg');
  const dlg = document.getElementById('reviewDialog');
  let routes = [], reviewId = null, reviewMode = null;

  (async function init() {
    if (!requireRole('ADMIN')) return;
    document.getElementById('who').textContent = Auth.user.name;
    await Promise.all([loadStats(), loadRoutes()]);
    await loadApplications();
  })();

  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('active', x === b));
    ['applications', 'expiring', 'routes', 'students'].forEach(t =>
      document.getElementById('tab-' + t).classList.toggle('hidden', t !== b.dataset.tab));
    if (b.dataset.tab === 'expiring') loadExpiring();
    if (b.dataset.tab === 'students') loadStudents();
  });

  async function safe(fn) { try { await fn(); } catch (e) { showMessage(msg, errorText(e), 'error'); } }

  async function loadStats() {
    await safe(async () => {
      const d = await api('/api/admin/dashboard');
      const items = [['Students', d.totalStudents], ['Routes', d.totalRoutes], ['Applications', d.totalApplications],
        ['Pending', d.pendingApplications], ['Approved', d.approvedApplications], ['Rejected', d.rejectedApplications],
        ['Active passes', d.activePasses], ['Expiring in 30 days', d.passesExpiringIn30Days]];
      document.getElementById('stats').innerHTML = items.map(i => '<div class="stat"><b>' + esc(i[1]) + '</b><span>' + esc(i[0]) + '</span></div>').join('');
    });
  }

  async function loadApplications() {
    await safe(async () => {
      const p = new URLSearchParams();
      [['status', 'fStatus'], ['routeId', 'fRoute'], ['appliedFrom', 'fFrom'], ['appliedTo', 'fTo']].forEach(([k, id]) => {
        const v = document.getElementById(id).value; if (v) p.set(k, v);
      });
      const list = await api('/api/admin/applications?' + p.toString());
      const body = document.getElementById('appRows');
      if (!list.length) { body.innerHTML = '<tr><td colspan="11" class="muted">No applications found.</td></tr>'; return; }
      body.innerHTML = list.map(a => {
        const note = a.status === 'REJECTED' ? esc(a.remark) + '<br><b>Reason:</b> ' + esc(a.rejectionReason) : (esc(a.remark) || '-');
        const validity = a.validFrom ? fmtDate(a.validFrom) + ' to ' + fmtDate(a.validTo) + '<br>' + (a.passState ? badge(a.passState) : '') : '-';
        const actions = a.status === 'PENDING'
          ? '<button class="small ok" onclick="openReview(' + a.id + ',\'approve\')">Approve</button><button class="small danger" onclick="openReview(' + a.id + ',\'reject\')">Reject</button>' : '';
        return '<tr><td>' + esc(a.id) + '</td><td>' + esc(a.studentName) + '<br><span class="muted">' + esc(a.registerNumber) + '</span></td>'
          + '<td>' + esc(a.routeNumber) + '</td><td>' + esc(a.boardingPoint) + '</td><td>' + esc(a.photoReference) + '</td>'
          + '<td>' + badge(a.status) + '</td><td>' + note + '</td><td>' + (esc(a.passNumber) || '-') + '</td><td>' + validity
          + '</td><td>' + fmtDateTime(a.appliedAt) + '</td><td>' + actions + '</td></tr>';
      }).join('');
    });
  }
  document.getElementById('filterBtn').onclick = loadApplications;

  function openReview(id, mode) {
    reviewId = id; reviewMode = mode;
    document.getElementById('reviewForm').reset();
    document.getElementById('dlgError').classList.add('hidden');
    document.getElementById('dlgTitle').textContent = (mode === 'approve' ? 'Approve' : 'Reject') + ' application #' + id;
    document.getElementById('approveFields').classList.toggle('hidden', mode !== 'approve');
    document.getElementById('rejectFields').classList.toggle('hidden', mode !== 'reject');
    document.getElementById('dFrom').required = mode === 'approve';
    document.getElementById('dTo').required = mode === 'approve';
    document.getElementById('dReason').required = mode === 'reject';
    if (mode === 'approve') document.getElementById('dFrom').value = new Date().toISOString().substring(0, 10);
    dlg.showModal();
  }
  document.getElementById('dlgCancel').onclick = () => dlg.close();

  document.getElementById('reviewForm').addEventListener('submit', async e => {
    e.preventDefault();
    const remark = document.getElementById('dRemark').value;
    const body = reviewMode === 'approve'
      ? { remark, validFrom: document.getElementById('dFrom').value, validTo: document.getElementById('dTo').value }
      : { remark, rejectionReason: document.getElementById('dReason').value };
    try {
      await api('/api/admin/applications/' + reviewId + '/' + reviewMode, { method: 'PUT', body: JSON.stringify(body) });
      dlg.close();
      showMessage(msg, 'Application #' + reviewId + (reviewMode === 'approve' ? ' approved.' : ' rejected.'), 'success');
      await Promise.all([loadApplications(), loadStats()]);
    } catch (err) {
      const box = document.getElementById('dlgError');
      box.textContent = errorText(err); box.classList.remove('hidden');
    }
  });

  async function loadExpiring() {
    await safe(async () => {
      const days = document.getElementById('days').value || 30;
      const list = await api('/api/admin/passes/expiring?days=' + encodeURIComponent(days));
      document.getElementById('expRows').innerHTML = list.length ? list.map(a =>
        '<tr><td>' + esc(a.passNumber) + '</td><td>' + esc(a.studentName) + '</td><td>' + esc(a.registerNumber) + '</td><td>'
        + esc(a.routeNumber) + '</td><td>' + fmtDate(a.validTo) + '</td><td>' + esc(a.daysToExpiry) + '</td></tr>').join('')
        : '<tr><td colspan="6" class="muted">No passes expiring in this period.</td></tr>';
    });
  }
  document.getElementById('expBtn').onclick = loadExpiring;

  async function loadRoutes() {
    await safe(async () => {
      routes = await api('/api/routes?includeInactive=true');
      const sel = document.getElementById('fRoute');
      const keep = sel.value;
      sel.innerHTML = '<option value="">All</option>' + routes.map(r => '<option value="' + esc(r.id) + '">' + esc(r.routeNumber) + '</option>').join('');
      sel.value = keep;
      document.getElementById('routeRows').innerHTML = routes.map(r =>
        '<tr><td>' + esc(r.routeNumber) + '</td><td>' + esc(r.routeName) + '</td><td>' + esc(r.startPoint) + '</td><td>' + esc(r.endPoint)
        + '</td><td>' + esc(r.fare) + '</td><td>' + (r.active ? 'Yes' : 'No') + '</td><td>'
        + '<button class="small secondary" onclick="toggleRoute(' + r.id + ')">' + (r.active ? 'Deactivate' : 'Activate') + '</button>'
        + '<button class="small danger" onclick="deleteRoute(' + r.id + ')">Delete</button></td></tr>').join('');
    });
  }

  document.getElementById('routeForm').addEventListener('submit', async e => {
    e.preventDefault();
    await safe(async () => {
      await api('/api/routes', { method: 'POST', body: JSON.stringify({
        routeNumber: document.getElementById('rNo').value, routeName: document.getElementById('rName').value,
        startPoint: document.getElementById('rStart').value, endPoint: document.getElementById('rEnd').value,
        fare: Number(document.getElementById('rFare').value), active: true }) });
      e.target.reset(); showMessage(msg, 'Route added.', 'success'); await loadRoutes(); await loadStats();
    });
  });

  async function toggleRoute(id) {
    const r = routes.find(x => x.id === id);
    await safe(async () => {
      await api('/api/routes/' + id, { method: 'PUT', body: JSON.stringify({
        routeNumber: r.routeNumber, routeName: r.routeName, startPoint: r.startPoint, endPoint: r.endPoint, fare: r.fare, active: !r.active }) });
      await loadRoutes();
    });
  }

  async function deleteRoute(id) {
    if (!confirm('Delete this route?')) return;
    await safe(async () => { await api('/api/routes/' + id, { method: 'DELETE' }); showMessage(msg, 'Route deleted.', 'success'); await loadRoutes(); await loadStats(); });
  }

  async function loadStudents() {
    await safe(async () => {
      const list = await api('/api/admin/students');
      document.getElementById('studentRows').innerHTML = list.length ? list.map(s =>
        '<tr><td>' + esc(s.id) + '</td><td>' + esc(s.name) + '</td><td>' + esc(s.registerNumber) + '</td><td>' + esc(s.department)
        + '</td><td>' + esc(s.email) + '</td><td>' + esc(s.phone) + '</td></tr>').join('')
        : '<tr><td colspan="6" class="muted">No students registered yet.</td></tr>';
    });
  }
</script>
</body>
</html>
